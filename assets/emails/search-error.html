{{define "subject"}}Search Error for User {{.UserID}}{{end}}

{{define "body"}}
<h2>Search Error Notification</h2>

<p>A search error has occurred:</p>

<dl>
    <dt>User ID:</dt>
    <dd>{{.UserID}}</dd>

    <dt>User Email:</dt>
    <dd>{{.UserEmail}}</dd>

    <dt>Error:</dt>
    <dd>{{.Error}}</dd>

    <dt>Search Criteria:</dt>
    <dd><pre>{{.Criteria}}</pre></dd>

    <dt>Timestamp:</dt>
    <dd>{{.Timestamp}}</dd>
</dl>
{{end}}
