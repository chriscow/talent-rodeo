{{define "job-styles"}}
<style>   
    /* Job card base styles */
    .job-card {
        transition: opacity 0.3s ease, transform 0.3s ease;
        transform-origin: center;
        position: relative;
    }
    
    /* Admin debug info */
    .admin-debug {
        background: #f0f0f0;
        color: #333;
        padding: 0.5rem;
        margin-bottom: 1rem;
        border-radius: 0.25rem;
        font-size: 0.85rem;
        border: 1px solid #ddd;
    }
    
    /* Job section spacing */
    .job-section {
        margin-bottom: 2rem;
    }
    
    /* Feedback item styles - controls the appearance of each feedback <li> */
    .feedback-item {
        width: 100%; /* Makes the item take full width of its container */
        padding: 0.5rem 0; /* Vertical padding for spacing */
        border-radius: 4px; /* Rounded corners for a softer look */
        transition: background-color 0.2s ease; /* Smooth background color transition on hover */
        list-style: none; /* Removes default list bullet */
        min-height: 2.5rem; /* Ensures a minimum height for each item */
        line-height: 1.4; /* Improves text readability */
    }
    
    /* Feedback item hover - changes background and adds horizontal padding on hover */
    .feedback-item:hover {
        /*background-color: var(--pico-muted-color, #f1f3f4); */  /* Light background on hover, uses PicoCSS variable if available, otherwise fallback */
        background-color: rgba(200, 200, 200, 1);
        padding-left: 0.5rem;  /* Adds left padding on hover for visual feedback */
        padding-right: 0.5rem; /* Adds right padding on hover for visual feedback */
    }
    
    /* Text inside feedback item - ensures text is inline and not constrained */
    .item-text {
        line-height: 1.4; /* Consistent line height */
        display: inline !important; /* Forces inline display, overrides resets */
        width: auto !important; /* Removes any width constraints */
        height: auto !important; /* Removes any height constraints */
    }
    
    /* Feedback buttons container - aligns buttons next to text, initially hidden */
    .feedback-buttons {
        display: inline; /* Buttons appear inline with text */
        margin-left: 0.75rem; /* Space between text and buttons */
        opacity: 0; /* Hidden by default */
        transition: opacity 0.2s ease; /* Smooth fade-in on hover */
        vertical-align: baseline; /* Aligns with text baseline */
    }
    
    /* Show feedback buttons when parent is hovered OR when a button is active (liked/disliked) */
    .feedback-item:hover .feedback-buttons,
    .feedback-buttons:has(.active-like),
    .feedback-buttons:has(.active-dislike) {
        opacity: 1; /* Fade in buttons on hover or when active */
    }
    
    /* Feedback button base styles - overrides PicoCSS for custom look */
    .feedback-buttons button {
        all: unset; /* Removes all default button styles */
        box-sizing: border-box; /* Ensures padding/border are included in width */
        display: inline-flex; /* Allows for icon and text alignment */
        align-items: center; /* Vertically centers content */
        justify-content: center; /* Horizontally centers content */
        padding: 0.25rem 0.5rem; /* Button padding */
        font-size: 0.8rem; /* Smaller font for compact buttons */
        margin: 0; /* No margin between buttons */
        background: var(--pico-background-color, #fff); /* Button background, uses PicoCSS variable if available */
        color: var(--pico-color, #333); /* Button text color, uses PicoCSS variable if available */
        cursor: pointer; /* Pointer cursor on hover */
        border-radius: 0.25rem; /* Rounded corners */
        font-family: inherit; /* Inherits font from parent */
        transition: all 0.2s ease; /* Smooth transition for all properties */
        vertical-align: baseline; /* Aligns with text baseline */
    }
    
    /* Active feedback button styles - visually distinguishes selected state */
    .feedback-buttons button.active-like {
        border: 1px solid transparent !important; /* Removes border for active state */
        background: #1e8eff !important; /* Brighter blue background for like in light mode */
        color: white !important; /* White text for contrast */
    }
    
    /* Dark theme: like button active state */
    /* [data-theme="dark"] .feedback-buttons button.active-like {
        background: var(--pico-primary, #1976d2) !important; 
        border-color: var(--pico-primary, #1976d2) !important; 
    } */
    
    .feedback-buttons button.active-dislike {
        border: 1px solid transparent !important; /* Removes border for active state */
        color: white !important; /* White text for contrast */
    }
    
    /* Dislike button specific active state - uses a red color */
    .feedback-buttons button.active-dislike {
        background: #d32f2f !important; /* Brighter red background for dislike in light mode */
        border-color: #d32f2f !important; /* Brighter red border for dislike in light mode */
    }
    
    /* Dark theme: dislike button active state */
    /* [data-theme="dark"] .feedback-buttons button.active-dislike {
        background: var(--pico-del-color, #d32f2f) !important; 
        border-color: var(--pico-del-color, #d32f2f) !important;
    } */
    
    /* Button border radius adjustments for first and last buttons */
    .feedback-buttons button:first-child {
        border-right: none; /* Removes border between buttons */
        border-top-right-radius: 0; /* Square corner between buttons */
        border-bottom-right-radius: 0; /* Square corner between buttons */
    }
    .feedback-buttons button:last-child {
        border-top-left-radius: 0; /* Square corner between buttons */
        border-bottom-left-radius: 0; /* Square corner between buttons */
    }
    
    /* Button hover state (when not active) - uses secondary color */
    .feedback-buttons button:hover:not(.active-like):not(.active-dislike) {
        background: var(--pico-secondary, #6c757d); /* Secondary color background */
        border-color: var(--pico-secondary, #6c757d); /* Secondary color border */
        color: white; /* White text for contrast */
    }
    
    /* Dark theme: feedback item hover background */
    [data-theme="dark"] .feedback-item:hover {
        background-color: rgba(255, 255, 255, 0.05); /* Subtle light overlay for dark mode */
    }
    
    /* Dark theme: feedback button base styles */
    [data-theme="dark"] .feedback-buttons button {
        background: var(--pico-background-color, #11191f); /* Dark background */
        color: var(--pico-color, #c2c8d0); /* Light text */
        border-color: var(--pico-muted-border-color, #374151); /* Dark border */
    }
    
    /* Theme-specific icon visibility - shows only the correct icon for the theme */
    .light-theme-icon,
    .dark-theme-icon {
        display: inline-block; /* Both icons are inline by default */
    }
    
    /* Hide dark theme icons in light mode */
    html[data-theme="light"] .dark-theme-icon,
    html:not([data-theme]) .dark-theme-icon {
        display: none; /* Hide dark icon in light mode */
    }
    html[data-theme="light"] .light-theme-icon,
    html:not([data-theme]) .light-theme-icon {
        display: inline-block; /* Show light icon in light mode */
    }
    
    /* Hide light theme icons in dark mode */
    html[data-theme="dark"] .light-theme-icon {
        display: none; /* Hide light icon in dark mode */
    }
    html[data-theme="dark"] .dark-theme-icon {
        display: inline-block; /* Show dark icon in dark mode */
    }
    
    /* Auto theme detection for systems without explicit theme attribute */
    @media (prefers-color-scheme: dark) {
        html:not([data-theme]) .light-theme-icon {
            display: none; /* Hide light icon if system is dark and no theme set */
        }
        html:not([data-theme]) .dark-theme-icon {
            display: inline-block; /* Show dark icon if system is dark and no theme set */
        }
    }
    @media (prefers-color-scheme: light) {
        html:not([data-theme]) .dark-theme-icon {
            display: none; /* Hide dark icon if system is light and no theme set */
        }
        html:not([data-theme]) .light-theme-icon {
            display: inline-block; /* Show light icon if system is light and no theme set */
        }
    }


    hgroup h3 {
        display: inline !important; /* Forces inline display, overrides resets */
        width: auto !important; /* Removes any width constraints */
        height: auto !important; /* Removes any height constraints */
    }
    
    /* Job title feedback specific styles */
    .job-title-feedback {
        display: flex;
        align-items: center;
        transition: background-color 0.2s ease;
        border-radius: 4px;
        padding: 0.25rem 0;
    }
    
    .job-title-feedback:hover {
        background-color: rgba(200, 200, 200, 0.3);
        padding-left: 0.5rem;
        padding-right: 0.5rem;
    }
    
    /* Job title buttons - larger than regular feedback buttons */
    .job-title-buttons {
        display: inline;
        margin-left: 0.75rem;
        opacity: 0;
        transition: opacity 0.2s ease;
        vertical-align: baseline;
    }
    
    .job-title-feedback:hover .job-title-buttons,
    .job-title-buttons:has(.active-like),
    .job-title-buttons:has(.active-dislike) {
        opacity: 1;
    }
    
    .job-title-buttons button {
        all: unset;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.375rem 0.75rem; /* Larger padding for 24px icons */
        font-size: 0.9rem; /* Slightly larger font */
        margin: 0;
        background: var(--pico-background-color, #fff);
        color: var(--pico-color, #333);
        cursor: pointer;
        border-radius: 0.25rem;
        font-family: inherit;
        transition: all 0.2s ease;
        vertical-align: baseline;
        border: 1px solid var(--pico-muted-border-color, #ddd);
    }
    
    .job-title-buttons button.active-like,
    .job-title-buttons button.active-dislike {
        border: 1px solid transparent !important;
    }
    
    .job-title-buttons button.active-like {
        background: #1976d2 !important; /* Brighter blue background for like in light mode */
        color: white !important;
    }
    
    /* Dark theme: job title like button active state */
    [data-theme="dark"] .job-title-buttons button.active-like {
        background: var(--pico-primary, #1976d2) !important; /* Uses PicoCSS variable or fallback */
        border-color: var(--pico-primary, #1976d2) !important; /* Uses PicoCSS variable or fallback */
    }
    
    .job-title-buttons button.active-dislike {
        background: #d32f2f !important; /* Brighter red background for dislike in light mode */
        border-color: #d32f2f !important; /* Brighter red border for dislike in light mode */
    }
    
    /* Dark theme: job title dislike button active state */
    [data-theme="dark"] .job-title-buttons button.active-dislike {
        background: var(--pico-del-color, #d32f2f) !important; /* Uses PicoCSS variable or fallback */
        border-color: var(--pico-del-color, #d32f2f) !important; /* Uses PicoCSS variable or fallback */
    }
    
    .job-title-buttons button:first-child {
        border-right: none;
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
    }
    
    .job-title-buttons button:last-child {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
    }
    
    .job-title-buttons button:hover:not(.active-like):not(.active-dislike) {
        background: var(--pico-secondary, #6c757d);
        border-color: var(--pico-secondary, #6c757d);
        color: white;
    }
    
    /* Dark theme support for job title buttons */
    [data-theme="dark"] .job-title-feedback:hover {
        background-color: rgba(255, 255, 255, 0.05);
    }
    
    [data-theme="dark"] .job-title-buttons button {
        background: var(--pico-background-color, #11191f);
        color: var(--pico-color, #c2c8d0);
        border-color: var(--pico-muted-border-color, #374151);
    }

    .job-close-btn {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        width: 2rem;
        height: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        color: var(--pico-muted-color, #888);
        cursor: pointer;
        padding: 0;
        z-index: 2;
        border-radius: 50%;
        transition: background 0.2s;
    }
    .job-close-btn:hover {
        background: var(--pico-muted-border-color, #eee);
        color: var(--pico-color, #333);
    }
</style>
{{end}}
