{{define "title"}}Chat with Shirely - Talent Rodeo{{end}}

{{define "page:main"}}
<main class="container-narrow">
    <article>
        <hgroup>
            <h1>Chat with Shirely</h1>
            <p>Tell me about your career preferences</p>
        </hgroup>
        
        <!-- Full-page Chat Interface -->
        <div id="chat-page-container" class="chat-page-container">
            <div class="chat-page-window">
                <div id="chat-messages" class="chat-page-messages">
                    <!-- Messages will be added here -->
                </div>
                <div class="chat-page-input-container">
                    <div class="chat-page-input-row">
                        <div class="input-with-status">
                            <input type="text" id="chat-input" placeholder="Type your message..." disabled>
                            <div id="chat-status-icon" class="chat-status-icon" title=""></div>
                        </div>
                        <button type="button" id="send-message-btn" class="chat-send-btn" disabled>Send</button>
                    </div>
                    <!-- Keep original status div hidden for fallback -->
                    <div id="chat-status" class="chat-page-status" style="display: none;"></div>
                </div>
            </div>
            
            <!-- <div class="chat-page-actions">
                <button type="button" id="end-chat-btn" class="secondary">End Conversation</button>
                <button type="button" id="minimize-to-widget-btn" class="outline" onclick="window.location.href='/onboarding'">Continue in Background</button>
            </div> -->
        </div>
    </article>

    {{if .User.IsSuperUser}}
    <div id="chat-session-info" style="display: none; margin-bottom: 2rem; padding: 1rem; background: var(--pico-card-background-color); border-radius: 0.5rem; border: 1px solid var(--pico-muted-border-color);">
        <p><strong>Session ID:</strong> <span id="session-appointment-id"></span></p>
        <p><strong>Status:</strong> <span id="session-status">Active</span></p>
        <div style="margin-top: 1rem;">
            <button id="fast-forward-btn" class="secondary" onclick="fastForwardChat()" style="margin-right: 1rem;">
                ⏩ Fast Forward (Testing)
            </button>
            <small style="color: var(--pico-muted-color);">Injects transcript from test CallID for testing</small>
        </div>
    </div>
    {{end}}
</main>

<style>
    /* Full-page Chat Styles */
    .chat-page-container {
        width: 100%;
        margin: 0 auto;
    }
    
    .chat-page-window {
        background: var(--pico-card-background-color);
        border: 1px solid var(--pico-muted-border-color);
        border-radius: 12px;
        height: 60vh;
        min-height: 500px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: var(--pico-card-box-shadow);
    }
    
    .chat-page-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: var(--pico-background-color);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    .chat-page-input-container {
        padding: 20px;
        border-top: 1px solid var(--pico-muted-border-color);
        background: var(--pico-card-background-color);
    }
    
    .chat-page-input-row {
        display: flex;
        gap: 12px;
        align-items: center;
        max-width: 600px;
        margin: 0 auto;
    }
    
    .input-with-status {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
    }
    
    #chat-input {
        flex: 1;
        border: 1px solid var(--pico-muted-border-color);
        border-radius: 25px;
        padding: 12px 50px 12px 20px; /* Add right padding for icon */
        font-size: 16px;
        outline: none;
        background: var(--pico-background-color);
        color: var(--pico-color);
        transition: all 0.2s ease;
    }
    
    .chat-status-icon {
        position: absolute;
        right: 15px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        transition: all 0.3s ease;
        cursor: help;
        display: none; /* Hidden by default */
    }
    
    .chat-status-icon.connected {
        background: var(--pico-ins-color);
        display: block;
        animation: pulse-success 2s infinite;
    }
    
    .chat-status-icon.connecting {
        background: var(--pico-primary-background);
        display: block;
        animation: pulse-info 1.5s infinite;
    }
    
    .chat-status-icon.error {
        background: var(--pico-del-color);
        display: block;
        animation: pulse-error 1s infinite;
    }
    
    .chat-status-icon.sending {
        background: var(--pico-primary-background);
        display: block;
        animation: spin 1s linear infinite;
    }
    
    @keyframes pulse-success {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.9); }
    }
    
    @keyframes pulse-info {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.95); }
    }
    
    @keyframes pulse-error {
        0%, 100% { opacity: 1; transform: scale(1); }
        25%, 75% { opacity: 0.8; transform: scale(1.1); }
        50% { opacity: 0.6; transform: scale(0.9); }
    }
    
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    #chat-input:focus {
        border-color: var(--pico-primary-background);
        box-shadow: 0 0 0 3px var(--pico-primary-focus);
    }
    
    #chat-input:disabled {
        background: var(--pico-muted-color);
        color: var(--pico-muted-color);
        cursor: not-allowed;
    }
    
    .chat-send-btn {
        background: var(--pico-primary-background);
        color: var(--pico-primary-inverse);
        border: none;
        border-radius: 25px;
        padding: 12px 24px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.2s ease;
        white-space: nowrap;
    }
    
    .chat-send-btn:hover:not(:disabled) {
        background: var(--pico-primary-hover-background);
        transform: translateY(-1px);
    }
    
    .chat-send-btn:disabled {
        background: var(--pico-muted-color);
        cursor: not-allowed;
        transform: none;
    }
    
    /* Message Styles with Modern Chat Patterns */
    .message {
        max-width: 70%;
        padding: 12px 18px;
        border-radius: 20px;
        word-wrap: break-word;
        line-height: 1.5;
        font-size: 16px;
        margin-bottom: 5px;
        position: relative;
        animation: messageSlideIn 0.3s ease-out;
    }
    
    @keyframes messageSlideIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .message.user {
        background: var(--pico-primary-background);
        color: var(--pico-primary-inverse);
        align-self: flex-end;
        border-bottom-right-radius: 8px;
    }
    
    .message.assistant {
        background: var(--pico-card-background-color);
        color: var(--pico-color);
        align-self: flex-start;
        border-bottom-left-radius: 8px;
        border: 1px solid var(--pico-muted-border-color);
    }
    
    .message.typing {
        background: var(--pico-muted-color);
        color: var(--pico-color);
        align-self: flex-start;
        font-style: italic;
        border-bottom-left-radius: 8px;
        animation: pulse 1.5s infinite;
    }
    
    .message.system {
        background: var(--pico-primary-focus);
        color: var(--pico-primary-background);
        align-self: center;
        border-radius: 12px;
        font-size: 14px;
        max-width: 90%;
        text-align: center;
        font-weight: 500;
        border: 1px solid var(--pico-primary-background);
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }
    
    /* Status indicators with better colors */
    .chat-page-status {
        text-align: center;
        font-size: 14px;
        padding: 10px;
        border-radius: 6px;
        margin: 10px 20px 0;
        transition: all 0.3s ease;
    }
    
    .chat-page-status.success {
        color: var(--pico-ins-color);
        background: var(--pico-ins-background-color);
    }
    
    .chat-page-status.error {
        color: var(--pico-del-color);
        background: var(--pico-del-background-color);
    }
    
    .chat-page-status.info {
        color: var(--pico-primary-background);
        background: var(--pico-primary-focus);
    }
    
    .chat-page-actions {
        margin-top: 20px;
        text-align: center;
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }
    
    /* Enhanced Scrollbar Styling */
    .chat-page-messages::-webkit-scrollbar {
        width: 8px;
    }
    
    .chat-page-messages::-webkit-scrollbar-track {
        background: transparent;
    }
    
    .chat-page-messages::-webkit-scrollbar-thumb {
        background: var(--pico-muted-color);
        border-radius: 4px;
        transition: background 0.2s ease;
    }
    
    .chat-page-messages::-webkit-scrollbar-thumb:hover {
        background: var(--pico-primary-background);
    }
    
    /* Responsive Mobile Improvements */
    @media (max-width: 768px) {
        .chat-page-window {
            height: 75vh;
            border-radius: 8px;
        }
        
        .message {
            max-width: 85%;
            font-size: 15px;
        }
        
        .chat-page-input-row {
            gap: 8px;
        }
        
        #chat-input {
            font-size: 16px; /* Prevent zoom on iOS */
            padding: 10px 40px 10px 16px; /* Add right padding for icon */
        }
        
        .chat-status-icon {
            right: 12px;
            width: 16px;
            height: 16px;
        }
        
        .chat-send-btn {
            padding: 10px 20px;
            font-size: 15px;
        }
        
        .chat-page-actions {
            flex-direction: column;
            align-items: center;
        }
        
        .chat-page-actions button {
            width: 100%;
            max-width: 300px;
        }
    }
    
    /* Loading state for better UX */
    .loading-dots {
        display: inline-block;
    }
    
    .loading-dots::after {
        content: '';
        animation: loadingDots 1.5s linear infinite;
    }
    
    @keyframes loadingDots {
        0%, 20% { content: '.'; }
        40%, 60% { content: '..'; }
        80%, 100% { content: '...'; }
    }
    
    /* Debug message styles for super users */
    .debug-message {
        background: var(--pico-muted-color) !important;
        color: var(--pico-color) !important;
        border: 1px solid var(--pico-muted-border-color) !important;
        border-radius: 8px;
        padding: 10px 15px;
        font-size: 14px;
        line-height: 1.4;
        margin-bottom: 5px;
        opacity: 0.8;
    }

    .debug-message .debug-prefix {
        font-weight: bold;
        color: var(--pico-primary-background);
        margin-right: 8px;
    }

    .debug-message .debug-content {
        display: inline-block;
        font-family: monospace;
        font-size: 13px;
    }
</style>

<script src="/static/js/chat_manager.js"></script>
<script>
// Initialize the chat manager globally so fastForwardChat can access it
window.chatManager = new ChatManager();
</script>
{{end}}
