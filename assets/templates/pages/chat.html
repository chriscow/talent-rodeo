{{define "title"}}Chat with Shirely - Talent Rodeo{{end}}

{{define "page:main"}}
<main class="container-narrow">
    <article>
        <header>
            <h1>💬 Chat with Shirely</h1>
            <p>Having a conversation about your career preferences</p>
        </header>
        
        <div id="chat-session-info" style="display: none; margin-bottom: 2rem; padding: 1rem; background: var(--card-background-color); border-radius: 0.5rem; border: 1px solid var(--muted-border-color);">
            <p><strong>Session ID:</strong> <span id="session-appointment-id"></span></p>
            <p><strong>Status:</strong> <span id="session-status">Active</span></p>
        </div>

        <!-- Full-page Chat Interface -->
        <div id="chat-page-container" class="chat-page-container">
            <div class="chat-page-window">
                <div id="chat-messages" class="chat-page-messages">
                    <!-- Messages will be added here -->
                </div>
                <div class="chat-page-input-container">
                    <div class="chat-page-input-row">
                        <input type="text" id="chat-input" placeholder="Type your message..." disabled>
                        <button type="button" id="send-message-btn" class="chat-send-btn" disabled>Send</button>
                    </div>
                </div>
                <div id="chat-status" class="chat-page-status"></div>
            </div>
            
            <div class="chat-page-actions">
                <button type="button" id="end-chat-btn" class="secondary">End Conversation</button>
                <button type="button" id="minimize-to-widget-btn" class="outline" onclick="window.location.href='/profile'">Continue in Background</button>
            </div>
        </div>
    </article>
</main>

<style>
    /* Full-page Chat Styles */
    .chat-page-container {
        max-width: 800px;
        margin: 0 auto;
    }
    
    .chat-page-window {
        background: var(--card-background-color);
        border: 1px solid var(--muted-border-color);
        border-radius: 12px;
        height: 60vh;
        min-height: 500px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    
    .chat-page-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: var(--background-color);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    .chat-page-input-container {
        padding: 20px;
        border-top: 1px solid var(--muted-border-color);
        background: var(--card-background-color);
    }
    
    .chat-page-input-row {
        display: flex;
        gap: 12px;
        align-items: center;
        max-width: 600px;
        margin: 0 auto;
    }
    
    #chat-input {
        flex: 1;
        border: 1px solid var(--muted-border-color);
        border-radius: 25px;
        padding: 12px 20px;
        font-size: 16px;
        outline: none;
        background: white;
        color: #333;
    }
    
    #chat-input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    }
    
    #chat-input:disabled {
        background: #f8f9fa;
        color: #6c757d;
        cursor: not-allowed;
    }
    
    .chat-send-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 25px;
        padding: 12px 24px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: background 0.2s ease;
        white-space: nowrap;
    }
    
    .chat-send-btn:hover:not(:disabled) {
        background: var(--primary-hover-color, #0056b3);
    }
    
    .chat-send-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
    
    /* Message Styles */
    .message {
        max-width: 70%;
        padding: 12px 18px;
        border-radius: 20px;
        word-wrap: break-word;
        line-height: 1.5;
        font-size: 16px;
        margin-bottom: 5px;
    }
    
    .message.user {
        background: var(--primary-color);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 8px;
    }
    
    .message.assistant {
        background: #f1f3f5;
        color: var(--color);
        align-self: flex-start;
        border-bottom-left-radius: 8px;
    }
    
    .message.typing {
        background: #e9ecef;
        color: #6c757d;
        align-self: flex-start;
        font-style: italic;
        border-bottom-left-radius: 8px;
    }
    
    .chat-page-status {
        text-align: center;
        font-size: 14px;
        color: var(--muted-color);
        padding: 10px;
    }
    
    .chat-page-actions {
        margin-top: 20px;
        text-align: center;
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }
    
    /* Scrollbar Styling */
    .chat-page-messages::-webkit-scrollbar {
        width: 8px;
    }
    
    .chat-page-messages::-webkit-scrollbar-track {
        background: transparent;
    }
    
    .chat-page-messages::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 4px;
    }
    
    .chat-page-messages::-webkit-scrollbar-thumb:hover {
        background: #999;
    }
    
    /* Mobile Responsive */
    @media (max-width: 768px) {
        .chat-page-window {
            height: 70vh;
        }
        
        .message {
            max-width: 85%;
            font-size: 15px;
        }
        
        .chat-page-input-row {
            gap: 8px;
        }
        
        #chat-input {
            font-size: 16px; /* Prevent zoom on iOS */
        }
        
        .chat-page-actions {
            flex-direction: column;
            align-items: center;
        }
        
        .chat-page-actions button {
            width: 100%;
            max-width: 300px;
        }
    }
</style>

<script>
// Chat page functionality
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const appointmentId = urlParams.get('appointment_id');
    
    if (!appointmentId) {
        // Redirect back to profile if no appointment ID
        window.location.href = '/profile';
        return;
    }
    
    // Initialize chat page functionality
    initializeChatPage(appointmentId);
});

let currentAppointmentId = null;
let eventSource = null;

function initializeChatPage(appointmentId) {
    currentAppointmentId = appointmentId;
    
    // Update session info display
    document.getElementById('session-appointment-id').textContent = appointmentId;
    document.getElementById('chat-session-info').style.display = 'block';
    
    // Load existing chat history
    loadChatHistory();
    
    // Enable input and set up event listeners
    setupChatControls();
    
    // Add initial message from LLM if no messages exist
    addInitialMessage();
}

async function loadChatHistory() {
    try {
        const response = await fetch(`/api/chat/history?appointment_id=${currentAppointmentId}`);
        if (response.ok) {
            const data = await response.json();
            const messages = data.messages || [];
            
            // Clear existing messages
            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.innerHTML = '';
            
            // Add messages to UI
            for (const message of messages) {
                addMessageToUI(message.role, message.content);
            }
            
            // Scroll to bottom
            scrollToBottom();
        } else {
            console.error('Failed to load chat history:', response.statusText);
            showStatus('Failed to load chat history', 'error');
        }
    } catch (error) {
        console.error('Error loading chat history:', error);
        showStatus('Error loading chat history', 'error');
    }
}

function setupChatControls() {
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-message-btn');
    const endChatButton = document.getElementById('end-chat-btn');
    
    // Enable input and send button
    chatInput.disabled = false;
    sendButton.disabled = false;
    
    // Focus on input
    chatInput.focus();
    
    // Send message on Enter key
    chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    
    // Send button click handler
    sendButton.addEventListener('click', sendMessage);
    
    // End chat button handler
    endChatButton.addEventListener('click', endChat);
}

async function addInitialMessage() {
    // Check if we already have messages
    const messagesContainer = document.getElementById('chat-messages');
    if (messagesContainer.children.length > 0) {
        return; // Already have messages, don't add initial message
    }
    
    // Add welcome message from Shirely
    const welcomeMessage = "Hi! I'm Shirely, your AI career assistant. I'm excited to learn about your career preferences and help you find great job opportunities. What kind of work environment do you prefer?";
    addMessageToUI('assistant', welcomeMessage);
    scrollToBottom();
}

async function sendMessage() {
    const chatInput = document.getElementById('chat-input');
    const message = chatInput.value.trim();
    
    if (!message) return;
    
    // Add user message to UI
    addMessageToUI('user', message);
    chatInput.value = '';
    scrollToBottom();
    
    // Disable input while sending
    chatInput.disabled = true;
    document.getElementById('send-message-btn').disabled = true;
    
    try {
        // Send message to backend
        const response = await fetch(`/chat/message?appointment_id=${currentAppointmentId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': getCSRFToken()
            },
            body: JSON.stringify({
                content: message,
                csrf_token: getCSRFToken()
            })
        });
        
        if (response.ok) {
            // Start streaming response
            startStreaming();
        } else {
            console.error('Failed to send message:', response.statusText);
            showStatus('Failed to send message', 'error');
            // Re-enable input
            chatInput.disabled = false;
            document.getElementById('send-message-btn').disabled = false;
        }
    } catch (error) {
        console.error('Error sending message:', error);
        showStatus('Error sending message', 'error');
        // Re-enable input
        chatInput.disabled = false;
        document.getElementById('send-message-btn').disabled = false;
    }
}

function startStreaming() {
    if (eventSource) {
        eventSource.close();
    }
    
    // Add typing indicator
    const typingId = addMessageToUI('assistant', 'Shirely is typing...', true);
    
    eventSource = new EventSource(`/chat/stream?appointment_id=${currentAppointmentId}`);
    
    let currentMessage = '';
    
    eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        if (data.type === 'content') {
            // Remove typing indicator if still present
            if (typingId) {
                const typingElement = document.getElementById(typingId);
                if (typingElement) {
                    typingElement.remove();
                }
            }
            
            // Update or create message with streaming content
            currentMessage += data.content;
            updateOrCreateStreamingMessage(currentMessage);
        } else if (data.type === 'done') {
            // Streaming complete
            eventSource.close();
            eventSource = null;
            
            // Re-enable input
            document.getElementById('chat-input').disabled = false;
            document.getElementById('send-message-btn').disabled = false;
            document.getElementById('chat-input').focus();
            
            showStatus('', ''); // Clear status
        } else if (data.type === 'error') {
            console.error('Streaming error:', data.message);
            showStatus('Error getting response', 'error');
            
            // Remove typing indicator
            if (typingId) {
                const typingElement = document.getElementById(typingId);
                if (typingElement) {
                    typingElement.remove();
                }
            }
            
            eventSource.close();
            eventSource = null;
            
            // Re-enable input
            document.getElementById('chat-input').disabled = false;
            document.getElementById('send-message-btn').disabled = false;
        }
    };
    
    eventSource.onerror = function(event) {
        console.error('EventSource error:', event);
        showStatus('Connection error', 'error');
        
        // Remove typing indicator
        if (typingId) {
            const typingElement = document.getElementById(typingId);
            if (typingElement) {
                typingElement.remove();
            }
        }
        
        eventSource.close();
        eventSource = null;
        
        // Re-enable input
        document.getElementById('chat-input').disabled = false;
        document.getElementById('send-message-btn').disabled = false;
    };
}

let streamingMessageId = null;

function updateOrCreateStreamingMessage(content) {
    if (streamingMessageId) {
        // Update existing streaming message
        const messageElement = document.getElementById(streamingMessageId);
        if (messageElement) {
            messageElement.textContent = content;
            scrollToBottom();
            return;
        }
    }
    
    // Create new streaming message
    streamingMessageId = addMessageToUI('assistant', content);
    scrollToBottom();
}

function addMessageToUI(role, content, isTyping = false) {
    const messagesContainer = document.getElementById('chat-messages');
    const messageDiv = document.createElement('div');
    const messageId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    
    messageDiv.id = messageId;
    messageDiv.className = `message ${role}`;
    if (isTyping) {
        messageDiv.className += ' typing';
    }
    messageDiv.textContent = content;
    
    messagesContainer.appendChild(messageDiv);
    scrollToBottom();
    
    return messageId;
}

function scrollToBottom() {
    const messagesContainer = document.getElementById('chat-messages');
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function showStatus(message, type = '') {
    const statusElement = document.getElementById('chat-status');
    statusElement.textContent = message;
    statusElement.className = `chat-page-status ${type}`;
}

async function endChat() {
    if (!currentAppointmentId) return;
    
    try {
        const response = await fetch(`/chat/end?appointment_id=${currentAppointmentId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': getCSRFToken()
            },
            body: JSON.stringify({
                csrf_token: getCSRFToken()
            })
        });
        
        if (response.ok) {
            // Close any active streaming
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            
            // Redirect to profile
            window.location.href = '/profile';
        } else {
            console.error('Failed to end chat:', response.statusText);
            showStatus('Failed to end chat', 'error');
        }
    } catch (error) {
        console.error('Error ending chat:', error);
        showStatus('Error ending chat', 'error');
    }
}

function getCSRFToken() {
    const meta = document.querySelector('meta[name="csrf-token"]');
    return meta ? meta.getAttribute('content') : '';
}
</script>
{{end}}
