{{define "title"}}Processing Resume - Profile{{end}}

{{define "page:main"}}
<main class="container-narrow">
    <article>
        <header>
            <h1>Processing Your Resume</h1>
        </header>

        <p>
            Please wait while we analyze your resume. This should only take a moment.
        </p>

        <div class="grid">
            <div style="text-align: center;">
                <progress></progress>
                <p id="status-message">{{.User.State.Status.Description}}</p>
            </div>
        </div>
    </article>
</main>

<!-- Add user data for state monitoring -->
<div data-user-id="{{.User.ID}}" 
     data-pusher-key="{{.PusherKey}}" 
     data-pusher-cluster="{{.PusherCluster}}"
     hidden></div>
{{end}}

{{define "page:scripts"}}
<script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const userElement = document.querySelector('[data-user-id]');
        if (!userElement) return;
        
        const pusher = new Pusher(userElement.dataset.pusherKey, {
            cluster: userElement.dataset.pusherCluster
        });
        
        const channel = pusher.subscribe(`user-${userElement.dataset.userId}`);
        const statusMessage = document.getElementById('status-message');
        
        channel.bind('state-update', function(data) {
            // Update status message if available
            if (statusMessage) {
                statusMessage.textContent = data.description;
            }

            // Handle redirects based on state
            if (data.error || data.status_text === 'Error') {
                window.location.href = '/profile';
            } else if (data.status_text === 'Resume Uploaded') {
                window.location.href = '/profile/schedule';
            }
        });
    });
</script>
{{end}}
