{{define "title"}}Upload Resume for User{{end}}

{{define "page:main"}}
<main class="container">
    <h1>Upload Resume for User</h1>
    {{if .Error}}
    <article class="error">{{.Error}}</article>
    {{end}}
    {{if .Success}}
    <article class="notice">{{.Success}}</article>
    {{end}}
    <form method="POST" enctype="multipart/form-data" autocomplete="off" style="max-width: 500px;">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label for="user_id"><strong>Select User</strong></label>
        <select name="user_id" id="user_id" required>
            <option value="">-- Select a User --</option>
            {{if .ActiveUsers}}
                <optgroup label="🟢 ACTIVE USERS">
                    {{range .ActiveUsers}}
                        {{$count := index $.UserSubscriptionCounts .ID}}
                        <option value="{{.ID}}" {{if eq $.SelectedUserID .ID}}selected{{end}}>
                            {{.Name}} ({{.Email}})
                            {{if .Tier}} - {{.Tier }}{{end}}
                            {{if gt $count 0}} - ({{$count}} subs){{end}}
                        </option>
                    {{end}}
                </optgroup>
            {{end}}
            {{if .ExpiredUsers}}
                <optgroup label="🟡 EXPIRED SUBSCRIPTIONS">
                    {{range .ExpiredUsers}}
                        {{$count := index $.UserSubscriptionCounts .ID}}
                        <option value="{{.ID}}" {{if eq $.SelectedUserID .ID}}selected{{end}}>
                            {{.Name}} ({{.Email}})
                            {{if .Tier}} - {{.Tier }}{{end}}
                            {{if gt $count 0}} - ({{$count}} subs){{end}}
                        </option>
                    {{end}}
                </optgroup>
            {{end}}
            {{if .OtherUsers}}
                <optgroup label="⚪ OTHER USERS">
                    {{range .OtherUsers}}
                        <option value="{{.ID}}" {{if eq $.SelectedUserID .ID}}selected{{end}}>
                            {{.Name}} ({{.Email}})
                        </option>
                    {{end}}
                </optgroup>
            {{end}}
        </select>
        <label for="phone">Phone Number (optional, E.164 format)</label>
        <input type="text" name="phone" id="phone" placeholder="+1XXXXXXXXXX" value="{{.Phone}}">
        <label for="resume"><strong>Resume File</strong></label>
        <input type="file" name="resume" id="resume" accept=".pdf,.docx,.txt" required>
        <button type="submit">Upload Resume</button>
    </form>
</main>
{{end}}
