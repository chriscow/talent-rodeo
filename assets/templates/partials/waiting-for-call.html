{{define "waiting-for-call"}}
<div id="schedule-container" class="container text-center">
    <h1>We'll be calling you shortly</h1>
    <p class="lead">Please keep your phone nearby. Our AI recruiter will call you at the scheduled time.</p>

    <div class="my-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="mt-4">
        <div class="d-flex justify-content-center gap-3">
            <form hx-post="/reschedule-call" hx-target="#schedule-container">
                <button type="submit" class="btn btn-outline-secondary">
                    Reschedule Call
                </button>
            </form>

            <button class="btn btn-outline-primary" hx-delete="/profile/resume" hx-target="body" hx-push-url="/profile"
                hx-confirm="Are you sure you want to upload a different resume? This will reset your profile.">
                Upload a Different Resume
            </button>
        </div>
    </div>
</div>
{{end}}
