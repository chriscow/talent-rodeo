{{define "search-task-list"}}
<figure>
    <table role="grid">
        <thead>
            <tr>
                <th scope="col">Task ID</th>
                <th scope="col">Criteria ID</th>
                <th scope="col">Status</th>
                <th scope="col">Provider</th>
                <th scope="col">Created At</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            {{if .Tasks}}
                {{range .Tasks}}
                <tr>
                    <td><code>{{.ID}}</code></td>
                    <td><code>{{.Criteria.ID}}</code></td>
                    <td><span class="status-badge status-{{.Status}}">{{.Status}}</span></td>
                    <td>{{.Provider}}</td>
                    <td>{{.CreatedAt.Format "Jan 2, 2006 3:04:05 PM"}}</td>
                    <td>
                        {{if eq .Status "queued"}}
                        <form method="POST" action="/admin/tasks" style="margin-bottom: 0;">
                            <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
                            <input type="hidden" name="task_id" value="{{.ID}}">
                            <button type="submit" name="action" value="cancel" class="outline" style="padding: 2px 6px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-trash-2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </form>
                        {{end}}
                    </td>
                </tr>
                {{end}}
            {{else}}
            <tr>
                <td colspan="6">No outstanding tasks found.</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</figure>
{{end}}
