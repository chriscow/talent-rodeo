{{define "partial:login"}}
<style>
    /* larger headers and header groups */
    header h1 {
        font-size: 3.5rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
    }

    header p {
        font-size: 2rem;
        font-weight: 400;
        margin-bottom: 1.5rem;
    }

    header {
        text-align: center;
    }


    #linkedin-signin {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-left: auto;
        margin-right: auto;
        margin-top: 2rem;
        margin-bottom: 2rem;
        text-decoration: none;
        max-width: 300px;
        width: 100%;
        padding: 0.5rem 1rem;
        border-radius: 5px;
    }

    #linkedin-signin img {
        margin-right: 0.5rem;
    }
</style>
<header>
    <section>
        <h1>Talent Rodeo Login</h1>
        <p>Perfect Job. Check.</p>
        <button id="linkedin-signin" class="contrast" onclick="login()">
            <img src="/static/img/linkedin/retina/Sign-In-Large---Active.png" alt="LinkedIn Logo" />
        </button>
        <img id="loading-spinner" src="/static/img/puff.svg" style="opacity: 0" />
    </section>
</header>
<script>
    function login() {
        document.getElementById('loading-spinner').style.opacity = 1;
        document.getElementById('linkedin-signin').style.display = 'none';
        window.location.href = "/auth/linkedin"
    }
</script>
{{end}}
