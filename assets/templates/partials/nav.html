{{define "partial:nav"}}
<nav class="container">
    <ul>
        <h2><a style="text-decoration: none;" href="/">Talent Rodeo</a></h2>
    </ul>
    {{if .User}}
    <ul>
        <!-- <li><a href="#">Auth Link 1</a></li>
        <li><a href="#">Auth Link 2</a></li> -->
    </ul>
    {{end}}
    <ul>
        <li>
            <details class="dropdown" role="list">
                <summary role="button" class="secondary">Theme</summary>
                <ul>
                    <li><a href="#" data-theme-switcher="auto">Auto</a></li>
                    <li><a href="#" data-theme-switcher="light">Light</a></li>
                    <li><a href="#" data-theme-switcher="dark">Dark</a></li>
                </ul>
            </details>
        </li>
        {{if .User}}
        <li>
            <form method="POST" action="/logout" style="margin: 0;">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <button type="submit" class="outline" style="margin: 0;">Logout</button>
            </form>
        </li>
        <li><a href="/profile"><img src="{{.User.AvatarURL}}" alt="avatar"
                    style="border-radius: 50%; height:50px;" /></a></li>
        {{end}}
    </ul>
</nav>
{{end}}
