{{define "partial:profile-search-keywords"}}
{{if .Keywords}}
<article>
    <header>
        <h3>Manage Search Keywords</h3>
    </header>
    <form class="sortable" hx-post="/keywords/save" hx-trigger="end">
        <div class="htmx-indicator">Updating...</div>
        {{range .Keywords}}
        <div><input type='hidden' name='item' value='{{.ID}}' />{{.Keyword}}</div>
        {{end}}
    </form>
</article>
<script>
    htmx.onLoad(function (content) {
        var sortables = content.querySelectorAll(".sortable");
        for (var i = 0; i < sortables.length; i++) {
            var sortable = sortables[i];
            var sortableInstance = new Sortable(sortable, {
                animation: 150,
                ghostClass: 'blue-background-class',

                // Make the `.htmx-indicator` unsortable
                filter: ".htmx-indicator",
                onMove: function (evt) {
                    return evt.related.className.indexOf('htmx-indicator') === -1;
                },

                // Disable sorting on the `end` event
                onEnd: function (evt) {
                    this.option("disabled", true);
                }
            });

            // Re-enable sorting on the `htmx:afterSwap` event
            sortable.addEventListener("htmx:afterSwap", function () {
                sortableInstance.option("disabled", false);
            });
        }
    })
</script>
{{else}}
<article style="opacity: 0;">
    <header>
        <h3>Search Keywords</h3>
    </header>
    <p>Keywords will appear here after your phone call.</p>
</article>
{{end}}
{{end}}


{{define "css:profile-search-keywords"}}
<style>
    .keyword-list {
        max-width: 600px;
        margin: 0 auto;
    }

    .keyword-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.5rem;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .keyword-item input {
        margin-bottom: 0;
    }

    .drag-handle {
        cursor: move;
        user-select: none;
    }

    .keyword-item.drop-target {
        border: 2px dashed #666;
        background: #f0f0f0;
        opacity: 0.1;
    }

    .keyword-item.dragging {
        opacity: 0.5;
    }
</style>
{{end}}
