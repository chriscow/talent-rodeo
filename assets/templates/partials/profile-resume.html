{{define "partial:profile-resume"}}
<article id="resume">
    {{if hasValue .User.ResumeFilename}}


    <header>
        <h3>Resume</h3>
    </header>
    <span style="overflow: clip">
        <img src="/static/img/check-square.24px.svg" />
        &nbsp;
        {{ .User.ResumeFilename }}
    </span>
    <div class="grid" style="grid-template-columns: 60% 1fr">
        <button hx-delete="/profile/resume">Reset Resume</button>
        <button hx-put="/onboarding/restart" hx-target="#resume" hx-swap="outerHTML">Restart Onboarding</button>
    </div>


    {{else}}
    <header>
        <h3>Resume Upload</h3>
    </header>
    <p>
        After you upload your resume, you will receive a brief phone call
        with an AI to go over the details of your desired next role.
    </p>
    <hr />

    <form method="post" action="/profile" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        <input type="hidden" id="session_id" name="session_id" value="{{ .SessionID }}">

        <label for="phone">
            Phone Number
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 555-5555" value="{{.Form.Phone}}"
                pattern="^[\+]?[(]?[0-9]{3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6}$" required {{if
                .Form.Validator.FieldErrors.Phone}}aria-invalid="true" {{end}}>
            <small id="invalid-helper" class='error'>{{.Form.Validator.FieldErrors.Phone}}</small>
        </label>

        <label for="resume">
            Resume (PDF or DOCX)
            <input type="file" id="resume" name="resume" accept=".pdf,.docx" required>
        </label>

        <button type="submit">Upload Resume</button>
    </form>
    {{end}}
</article>
{{end}}
