{{define "partial:onboarding-resume-processing"}}
<div style="text-align: center; padding: 2rem;">
    <h2>Processing Your Resume</h2>
    <p>We're analyzing your resume to understand your skills and experience. This usually takes just a few moments.</p>
    
    <div style="margin: 2rem 0;">
        <div class="loading-spinner" style="display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
    
    <p><em>Processing...</em></p>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    
    <script>
        // Listen for Pusher redirect when processing is complete
        if (typeof pusher !== 'undefined') {
            const channel = pusher.subscribe('user-{{.User.ID}}');
            channel.bind('redirect', function(data) {
                if (data.url) {
                    // Update the onboarding content to show next step
                    htmx.ajax('GET', '/profile/step/current', {target: '#onboarding-content'});
                }
            });
        }
        
        // Fallback: poll for status updates every 3 seconds
        const pollInterval = setInterval(function() {
            fetch('/api/user/status')
                .then(response => response.json())
                .then(data => {
                    if (data.status >= 4) { // UserStatusResumeUploaded
                        clearInterval(pollInterval);
                        htmx.ajax('GET', '/profile/step/current', {target: '#onboarding-content'});
                    }
                })
                .catch(error => {
                    console.log('Status check error:', error);
                });
        }, 3000);
        
        // Clean up interval when content changes
        document.addEventListener('htmx:beforeSwap', function() {
            if (typeof pollInterval !== 'undefined') {
                clearInterval(pollInterval);
            }
        });
    </script>
</div>
{{end}}
