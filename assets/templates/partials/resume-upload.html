{{define "partial:resume-upload"}}
<article id="resume">
    {{if .User.ResumeFilename}}
    <header>
        <h2>Resume</h2>
    </header>
    <div class="grid">
        <p>{{ .User.ResumeFilename }}</p>
        <i data-feather="square-check"></i>
    </div>
    {{else}}
    <header>
        <h2>Resume Upload</h2>
    </header>
    <form hx-post="/resume" hx-encoding="multipart/form-data" hx-target="#resume">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        <input type="hidden" id="session_id" name="session_id" value="{{ .SessionID }}">
        <!-- <div class="grid"> -->
        <label for="phone">
            Phone Number
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 555-5555" pattern="^\+?1?\d{10,}$">
        </label>
        <label for="resume">
            Resume (PDF or DOCX)
            <input type="file" id="resume" name="resume" accept=".pdf,.docx" required>
        </label>
        <!-- </div> -->
        <button type="submit">Upload Resume</button>
        <p id="status"></p>
    </form>
    <script>
        // Enable pusher logging - don't include this in production
        Pusher.logToConsole = true;

        var pusher = new Pusher('4a94faf46532a3c20d19', {
            cluster: 'us3'
        });

        var channel = pusher.subscribe("{{ .SessionID }}"); // 'my-channel'
        channel.bind('resume-status', function (data) {
            console.log(JSON.stringify(data));
        });
    </script>
    {{end}}
</article>
{{end}}
